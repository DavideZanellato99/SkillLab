name: CI

# Runs on direct pushes to the two long-lived branches (stage is the active
# integration branch, main the stable one) and on any PR targeting them.
on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (types)
        run: mypy
      - name: Requirements lock in sync with .in
        run: python ../.githooks/check-requirements-sync.py .

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skilllab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest fills every other required var with a placeholder; only the
      # database has to point at the service container above.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/skilllab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest (with coverage gate)
        run: pytest --cov

  frontend:
    name: Frontend lint, build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format (prettier)
        run: npm run format:check
      - name: Lint (oxlint)
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
      - name: Tests (vitest, with coverage gate)
        run: npm run test:coverage

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit being pushed, not
          # just the tip. gitleaks-action exits non-zero on any finding,
          # which fails this job and (via ci-success) blocks the merge.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: Docker build & compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the compose .env (database credentials)
        # docker-compose.yml has no defaults for these and refuses to start
        # without them, exactly as it would on a real deployment. Throwaway
        # values: this database lives for the length of the job.
        #
        # SITE_ADDRESS a ":80" serve in chiaro: il default "localhost" farebbe
        # emettere a Caddy un certificato con la sua CA interna e reindirizzare
        # da HTTP, e curl si fermerebbe sul certificato sconosciuto. Qui
        # interessa che lo stack risponda, non che TLS funzioni.
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=skilllab
          POSTGRES_PASSWORD=smoketest
          POSTGRES_DB=skilllab_db
          SITE_ADDRESS=:80
          BACKEND_REPLICAS=2
          BACKEND_CPUS=1.0
          BACKEND_MEM=1G
          DB_CPUS=1.0
          DB_MEM=1G
          DB_MEM_RESERVED=256M
          EOF
      - name: Create backend .env with placeholder values
        # Placeholder values are enough to boot; the smoke test only hits the
        # unauthenticated health endpoint, never the external APIs. In compose
        # DATABASE_URL is overridden to point at the "db" service.
        #
        # Every REQUIRED variable has to be here or the container refuses to
        # boot by design: this file is the check that the "no defaults for
        # anything that matters" rule stays true.
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/skilllab_db
          ALLOWED_ORIGINS=http://localhost
          COGNITO_REGION=eu-west-1
          COGNITO_USER_POOL_ID=
          COGNITO_APP_CLIENT_ID=
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-4o
          OPENAI_EVAL_MODEL=gpt-4o
          OPENAI_FALLBACK_MODELS=
          OPENAI_EVAL_FALLBACK_MODELS=
          CARTESIA_API_KEY=
          CARTESIA_MODEL=sonic-2
          CARTESIA_VERSION=2024-11-13
          CARTESIA_LANGUAGE=it
          CARTESIA_DEFAULT_VOICE_ID=
          CARTESIA_TTS_WS_URL=wss://api.cartesia.ai/tts/websocket
          ELEVENLABS_API_KEY=
          ELEVENLABS_STT_MODEL=scribe_v1
          ELEVENLABS_STT_LANGUAGE=it
          ELEVENLABS_VAD_SILENCE_SECS=0.8
          ELEVENLABS_VAD_THRESHOLD=0.5
          ELEVENLABS_STT_WS_URL=wss://api.elevenlabs.io/v1/speech-to-text/stream
          VOICE_LATENCY_LOG=1
          VOICE_STT_DEBUG=0
          MAX_CONCURRENT_CALLS=20
          DB_POOL_SIZE=5
          DB_MAX_OVERFLOW=15
          AUDIT_LOG_RETENTION_DAYS=180
          AUDIO_RECORDING_RETENTION_DAYS=90
          CONVERSATION_RETENTION_DAYS=730
          EOF
      - name: Build images and start the stack (production compose)
        # docker-compose.yml alone (without the dev override) is the real
        # production build: backend on uvicorn, frontend static behind nginx,
        # tutto dietro Caddy.
        #
        # Due repliche invece delle quattro di produzione: bastano a provare
        # che Caddy le scopre dal DNS di Docker e che le migrazioni all'avvio
        # reggono più processi in fila sullo stesso lock, senza chiedere a un
        # runner da quattro core di far partire quattro uvicorn insieme.
        run: docker compose -f docker-compose.yml up -d --build --scale backend=2
      - name: Wait for the backend health endpoint
        # From inside the network, not from the host: in production the
        # backend publishes no port at all (Caddy proxies /api over the
        # compose network), so curling localhost:8000 would only prove the
        # hardening had been undone.
        #
        # Il servizio ha più repliche, quindi la copia da interrogare va detta
        # esplicitamente. L'attesa è larga perché le repliche si mettono in
        # coda sul lock dello schema (vedi startup_migrations.prepare_schema).
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.yml exec -T --index 1 backend \
                 python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" 2>/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"; exit 1
      - name: Check the frontend is served through Caddy
        # Porta 80, non 3000: il frontend non pubblica niente, si arriva alla
        # React solo passando dal reverse proxy, come dal browser in
        # produzione.
        run: curl -fsS http://localhost/ >/dev/null
      - name: Check the API is reachable through Caddy
        # L'altra strada del Caddyfile: se il proxy verso le repliche non
        # funzionasse, nginx risponderebbe comunque con la pagina della React
        # e il controllo di sopra non se ne accorgerebbe.
        #
        # Un 401 è la risposta giusta: vuol dire che a rispondere è stato il
        # backend, che senza cookie di sessione rifiuta. Un 200 qui
        # significherebbe che /api/* sta finendo sul frontend.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/avatars)
          if [ "$code" != "401" ]; then
            echo "/api/avatars ha risposto $code invece di 401: Caddy non sta inoltrando al backend"; exit 1
          fi
          echo "l'API risponde dietro il proxy"
      - name: Check no service port is exposed beyond Caddy
        # La superficie di rete è parte del deploy, quindi è parte dei test:
        # database, API e frontend devono essere irraggiungibili dall'host, e
        # l'unica porta d'ingresso resta quella di Caddy.
        run: |
          for port in 5432 8000 8080 3000; do
            if curl -s --max-time 3 "http://localhost:$port/" >/dev/null 2>&1 \
               || nc -z -w3 localhost "$port" 2>/dev/null; then
              echo "porta $port raggiungibile dall'host: non deve esserlo in produzione"; exit 1
            fi
          done
          echo "solo il frontend è affacciato"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  infra-lint:
    name: Infra lint (hadolint, actionlint, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (backend Dockerfile)
        run: docker run --rm -i hadolint/hadolint < backend/Dockerfile
      - name: hadolint (frontend Dockerfile)
        run: docker run --rm -i hadolint/hadolint < frontend/Dockerfile
      - name: actionlint (workflow files)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
      - name: shellcheck (.githooks)
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable .githooks/pre-commit

  # Single check to require in branch settings: green only if every job above
  # succeeded.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-tests, frontend, secrets, docker-smoke, infra-lint]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed."; exit 1
          fi
          echo "All CI jobs passed."
