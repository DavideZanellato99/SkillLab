name: CI

# Runs on direct pushes to the two long-lived branches (stage is the active
# integration branch, main the stable one) and on any PR targeting them.
on:
  push:
    branches: [stage, main]
  pull_request:
    branches: [stage, main]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (types)
        run: mypy
      - name: Requirements lock in sync with .in
        run: python ../.githooks/check-requirements-sync.py .

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skilllab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest fills every other required var with a placeholder; only the
      # database has to point at the service container above.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/skilllab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest (with coverage gate)
        run: pytest --cov

  frontend:
    name: Frontend lint, build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format (prettier)
        run: npm run format:check
      - name: Lint (oxlint)
        run: npm run lint
      - name: Build (tsc + vite)
        run: npm run build
      - name: Tests (vitest, with coverage gate)
        run: npm run test:coverage

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit being pushed, not
          # just the tip. gitleaks-action exits non-zero on any finding,
          # which fails this job and (via ci-success) blocks the merge.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke:
    name: Docker build & compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the .env files the stack needs
        run: .github/scripts/write-ci-env.sh
      - name: Build images and start the stack (production compose)
        # docker-compose.yml alone (without the dev override) is the real
        # production build: backend on uvicorn, frontend static behind nginx,
        # tutto dietro Caddy.
        #
        # Due repliche invece delle quattro di produzione: bastano a provare
        # che Caddy le scopre dal DNS di Docker e che le migrazioni all'avvio
        # reggono più processi in fila sullo stesso lock, senza chiedere a un
        # runner da quattro core di far partire quattro uvicorn insieme.
        run: docker compose -f docker-compose.yml up -d --build --scale backend=2
      - name: Wait for the backend health endpoint
        # From inside the network, not from the host: in production the
        # backend publishes no port at all (Caddy proxies /api over the
        # compose network), so curling localhost:8000 would only prove the
        # hardening had been undone.
        #
        # Il servizio ha più repliche, quindi la copia da interrogare va detta
        # esplicitamente. L'attesa è larga perché le repliche si mettono in
        # coda sul lock dello schema (vedi startup_migrations.prepare_schema).
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.yml exec -T --index 1 backend \
                 python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" 2>/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"; exit 1
      - name: Check the readiness probe Caddy relies on
        # La rotta su cui il proxy decide dove mandare le chiamate: se
        # rispondesse male, Caddy non avrebbe nessuna replica sana e tutto il
        # sito risponderebbe 502. Il controllo di sopra non se ne accorgerebbe,
        # perché guarda la radice, che il database non lo tocca.
        #
        # Dall'interno della rete, come sopra: dal proxy questa rotta non passa
        # ed è voluto (vedi docs/docker-e-ambienti.md).
        run: |
          docker compose -f docker-compose.yml exec -T --index 1 backend python -c "from urllib.request import urlopen; assert urlopen('http://localhost:8000/health').status == 200"
          echo "la replica si dichiara pronta a servire"
      - name: Check the frontend is served through Caddy
        # Porta 80, non 3000: il frontend non pubblica niente, si arriva alla
        # React solo passando dal reverse proxy, come dal browser in
        # produzione.
        run: curl -fsS http://localhost/ >/dev/null
      - name: Check the security headers are on every road
        # Gli header stanno in un punto solo (caddy/Caddyfile) proprio perché
        # non si possano dimenticare su una delle due strade: questo controllo
        # guarda tutte e due, la React servita da nginx e l'API.
        #
        # Serve perché un header che sparisce non fa rumore: la pagina
        # continua a funzionare esattamente come prima, e la differenza si
        # vede solo il giorno in cui quell'header serviva davvero.
        run: |
          for path in / /api/avatars; do
            headers=$(curl -sS -o /dev/null -D - "http://localhost$path")
            for h in content-security-policy x-content-type-options referrer-policy permissions-policy; do
              if ! echo "$headers" | grep -qi "^$h:"; then
                echo "$h non c'è su $path"; exit 1
              fi
            done
            # La versione del server non aiuta chi la legge.
            if echo "$headers" | grep -qi "^server:"; then
              echo "il server si presenta su $path"; exit 1
            fi
            # Qui SITE_ADDRESS è ":80" e si chiama localhost: l'HSTS non deve
            # uscire, o si porterebbe dietro per un anno tutti i progetti
            # sulla stessa macchina di chi prova lo stack in locale.
            if echo "$headers" | grep -qi "^strict-transport-security:"; then
              echo "HSTS su localhost: la guardia sul dominio non funziona"; exit 1
            fi
          done
          # Le risposte dell'API non si conservano da nessuna parte, e la
          # React invece sì: sono due regole opposte sulle due strade, ed è
          # esattamente il genere di cosa che si scambia toccando il matcher.
          api=$(curl -sS -o /dev/null -D - "http://localhost/api/avatars")
          if ! echo "$api" | grep -qi "^cache-control:.*no-store"; then
            echo "l'API si può mettere in cache"; exit 1
          fi
          pagina=$(curl -sS -o /dev/null -D - "http://localhost/")
          if echo "$pagina" | grep -qi "^cache-control:.*no-store"; then
            echo "no-store sulla React: la cache degli asset non funziona più"; exit 1
          fi
          echo "gli header di sicurezza ci sono su tutte e due le strade"
      - name: Check the API is reachable through Caddy
        # L'altra strada del Caddyfile: se il proxy verso le repliche non
        # funzionasse, nginx risponderebbe comunque con la pagina della React
        # e il controllo di sopra non se ne accorgerebbe.
        #
        # Un 401 è la risposta giusta: vuol dire che a rispondere è stato il
        # backend, che senza cookie di sessione rifiuta. Un 200 qui
        # significherebbe che /api/* sta finendo sul frontend.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/avatars)
          if [ "$code" != "401" ]; then
            echo "/api/avatars ha risposto $code invece di 401: Caddy non sta inoltrando al backend"; exit 1
          fi
          echo "l'API risponde dietro il proxy"
      - name: Check no service port is exposed beyond Caddy
        # La superficie di rete è parte del deploy, quindi è parte dei test:
        # database, API e frontend devono essere irraggiungibili dall'host, e
        # l'unica porta d'ingresso resta quella di Caddy.
        run: |
          for port in 5432 8000 8080 3000; do
            if curl -s --max-time 3 "http://localhost:$port/" >/dev/null 2>&1 \
               || nc -z -w3 localhost "$port" 2>/dev/null; then
              echo "porta $port raggiungibile dall'host: non deve esserlo in produzione"; exit 1
            fi
          done
          echo "solo il frontend è affacciato"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  infra-lint:
    name: Infra lint (hadolint, actionlint, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Binari presi dalle release su GitHub, non immagini da Docker Hub.
      #
      # I tre strumenti giravano dentro un container ciascuno, e ogni "docker
      # run" era un pull anonimo da Docker Hub: i runner condividono gli
      # indirizzi con tutti gli altri progetti del mondo, quindi ogni tanto
      # quel pull torna indietro con "unauthorized: authentication required"
      # e il job diventa rosso senza che il codice c'entri (è già capitato,
      # run 33556042908). Le release su GitHub non hanno quel limite, e la
      # versione qui è scritta per esteso, quindi lo strumento non cambia
      # sotto i piedi da un giorno all'altro.
      - name: hadolint (Dockerfile)
        env:
          HADOLINT_VERSION: 2.15.1
        run: |
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x /tmp/hadolint
          /tmp/hadolint backend/Dockerfile frontend/Dockerfile
      - name: actionlint (workflow files)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color
      - name: shellcheck (script di shell del repo)
        # Preinstallato sui runner ubuntu, quindi qui non si scarica niente.
        run: shellcheck .githooks/pre-commit .github/scripts/write-ci-env.sh deploy/deploy.sh

  # Single check to require in branch settings: green only if every job above
  # succeeded.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-tests, frontend, secrets, docker-smoke, infra-lint]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed."; exit 1
          fi
          echo "All CI jobs passed."
