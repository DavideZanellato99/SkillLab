name: Security

# Dependency and code scanning (Trivy, pip-audit, npm audit, CodeQL) più la
# scansione dinamica dell'applicazione in esecuzione (ZAP). Kept separate from
# ci.yml so a newly-disclosed CVE shows up on the weekly schedule without
# waiting for a code change, and so these (sometimes noisy) checks are not the
# ones gating every merge. Secret scanning (gitleaks) is the exception: it
# lives in ci.yml because it IS a blocking gate.
#
# Nessun job qui dentro compare fra i needs di ci-success, quindi un rosso in
# questo workflow si vede ma non blocca un merge: è voluto, sono controlli che
# dipendono da cosa il mondo ha scoperto stanotte, non da cosa hai scritto tu.
on:
  pull_request:
    branches: [stage, main]
  push:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning (gitleaks) lives in ci.yml instead: it is a blocking
  # gate, so it belongs with the checks that must pass before a merge.
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: pip-audit (lock di runtime)
        # --require-hashes: si controlla esattamente ciò che verrà installato,
        # non la versione che il resolver sceglierebbe oggi.
        #
        # PYSEC-2026-1325 (ecdsa, arriva via python-jose): timing attack senza
        # release corretta disponibile. Esclusa così il job resta un segnale
        # utile sulle trovate NUOVE invece di essere rosso fisso; da
        # ricontrollare quando ecdsa pubblica un fix, o rimuovere migrando
        # python-jose -> PyJWT.
        run: pip-audit --require-hashes -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
      - name: pip-audit (lock di sviluppo)
        run: pip-audit --require-hashes -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (frontend)
        # npm audit lavora sul package-lock.json contro il registry: non serve
        # installare le dipendenze.
        working-directory: frontend
        run: npm audit --audit-level=high

  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Write the .env files the stack needs
        run: .github/scripts/write-ci-env.sh
      - name: Build images and start the stack (production compose)
        # Lo stesso stack dello smoke test di ci.yml, cioè il compose di
        # produzione senza l'override di sviluppo: si scansiona quello che
        # verrà messo online, non un server di sviluppo con altre
        # intestazioni e altri messaggi d'errore.
        run: docker compose -f docker-compose.yml up -d --build --scale backend=2
      - name: Wait for the stack to answer through Caddy
        # Si aspetta dalla porta 80, non da dentro la rete, perché è da lì che
        # entrerà ZAP. Il 401 su /api serve a distinguere "il backend risponde"
        # da "nginx sta servendo la React anche sotto /api": nel secondo caso
        # la scansione girerebbe su metà applicazione senza dirlo.
        run: |
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/avatars || true)
            if curl -fsS http://localhost/ >/dev/null 2>&1 && [ "$code" = "401" ]; then
              echo "lo stack risponde"; exit 0
            fi
            sleep 2
          done
          echo "lo stack non è salito in tempo"; exit 1
      - name: Prepare the report directory
        # Il container di ZAP gira con un utente suo (uid 1000), che non è
        # quello che possiede il workspace del runner: senza questo, il job
        # muore alla scrittura del report dopo aver scansionato per dieci
        # minuti.
        run: mkdir -p zap-out && chmod 777 zap-out
      - name: ZAP baseline scan
        # --network host: il bersaglio è Caddy sulla porta 80 del runner, e da
        # dentro una rete bridge "localhost" sarebbe il container stesso.
        #
        # Il piano è montato in sola lettura e separato dalla cartella dei
        # report, così ZAP non può riscriverselo.
        #
        # Esce 1 se ci sono alert Medium o High (vedi il job exitStatus nel
        # piano), quindi questo passo rende rosso il job. Il caricamento sotto
        # gira comunque grazie a if: always().
        run: |
          docker run --rm --network host \
            -v "$PWD/.zap:/zap/plan:ro" \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/plan/baseline.yaml
      - name: Normalise the report file name
        # ZAP aggiunge da sé l'estensione del template al nome che gli si dà,
        # quindi il file si cerca con una glob invece di indovinarne il nome.
        if: always()
        run: |
          report=$(find zap-out -maxdepth 1 -type f -name 'zap-dast*' | head -1)
          if [ -z "$report" ]; then
            echo "ZAP non ha prodotto nessun report: il motivo è nel log del passo precedente"
            exit 1
          fi
          mv "$report" zap-dast.sarif
      - name: Upload DAST results to the Security tab
        if: always() && hashFiles('zap-dast.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zap-dast.sarif
          category: zap-dast
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  filesystem:
    name: Filesystem scan (trivy)
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish the SARIF results under the repo's Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        # Il tag ha la "v" davanti: "aquasecurity/trivy-action@0.28.0" non
        # esiste e il job muore in "Set up job", prima di eseguire qualsiasi
        # cosa, senza un messaggio che spieghi il perché.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # misconfig added so Dockerfile/compose hardening issues (e.g. a
          # container left running as root) are caught, not just CVEs/secrets.
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # SARIF so the findings land in the Security tab, not just the log.
          # exit-code 1 still fails the job on a fixable HIGH/CRITICAL, which
          # keeps this a gate; the upload below runs even on that failure.
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"
          # Senza questa, "severity" vale per il codice di uscita ma non per il
          # file SARIF, che finirebbe nella tab Security con dentro anche tutte
          # le LOW e MEDIUM, cioè il rumore che la riga sopra voleva togliere.
          limit-severities-for-sarif: true
      - name: Upload filesystem results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  images:
    name: Image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      # The filesystem scan above covers the source tree; this scans the
      # *built* image, so OS-level CVEs in the base images (python-slim,
      # nginx-alpine) are caught too. docker-smoke in ci.yml already builds
      # these, but rebuilding here keeps security scans self-contained.
      - name: Build ${{ matrix.name }} image
        run: docker build -t skilllab-${{ matrix.name }}:scan ${{ matrix.context }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: skilllab-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          exit-code: "1"
          limit-severities-for-sarif: true
      - name: Upload ${{ matrix.name }} image results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
