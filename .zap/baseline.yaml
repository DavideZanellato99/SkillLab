# Piano DAST, eseguito dal job "dast" di .github/workflows/security.yml contro
# lo stack di produzione avviato dal runner.
#
# È un baseline passivo: ZAP naviga l'applicazione e giudica le risposte che
# riceve, senza mai mandare payload di attacco. La differenza non è formale,
# un active scan scrive davvero sul bersaglio (POST, tentativi di injection),
# e su uno stack usa e getta si potrebbe anche fare, ma renderebbe il job
# lungo e ballerino senza aggiungere molto finché non c'è l'autenticazione.
#
# Cosa NON copre, ed è bene saperlo prima di leggere un risultato verde:
# l'applicazione sta dietro Cognito, quindi qui dentro si arriva solo alla
# pagina di login, ai file statici e alle rotte /api/* che rispondono 401.
# Tutto ciò che vive dopo il login non viene toccato. Il valore vero di questa
# scansione sono le intestazioni di sicurezza e i flag dei cookie che Caddy e
# nginx mandano al browser, che sono esattamente le cose che nessun test
# unitario guarda.
#
# Perché l'Automation Framework e non zap-baseline.py: solo da qui esce un
# report SARIF nativo (template sarif-json), che è il formato con cui tutte le
# altre scansioni del repo finiscono nella tab Security. Con lo script
# baseline servirebbe un convertitore JSON -> SARIF scritto a mano da
# mantenere.

env:
  vars:
    # Il bersaglio di serie è Caddy sulla porta 80 della macchina che scansiona,
    # che è come lo vede il runner. Una variabile d'ambiente con lo stesso nome
    # ha la precedenza su questa, ed è così che si rifà la stessa scansione in
    # locale senza toccare il piano:
    #
    #   docker compose -f docker-compose.yml up -d --build
    #   mkdir -p zap-out && chmod 777 zap-out
    #   docker run --rm --network skilllab_default -e TARGET=http://caddy \
    #     -v "$PWD/.zap:/zap/plan:ro" -v "$PWD/zap-out:/zap/wrk:rw" \
    #     ghcr.io/zaproxy/zaproxy:stable zap.sh -cmd -autorun /zap/plan/baseline.yaml
    #
    # Da rete di compose e non con --network host perché su Docker Desktop
    # (Windows, Mac) "localhost" dentro un container è il container stesso: il
    # bersaglio va chiamato col nome del servizio.
    TARGET: http://localhost
  contexts:
    - name: skilllab
      urls:
        - ${TARGET}
  parameters:
    # Un job che fallisce non deve portarsi via il report: i job in fondo sono
    # marcati alwaysRun, e questo li lascia arrivare in fondo comunque.
    failOnError: false
    failOnWarning: false
    # Il progresso a stdout, altrimenti nei log della Actions si vedono dieci
    # minuti di niente e non si capisce dove si è piantato.
    progressToStdout: true

jobs:
  # Lo spider tradizionale legge l'HTML servito da nginx. Da solo su una React
  # trova poco (l'index e gli asset), ma è veloce e mette in coda le risposte
  # su cui lavorano le regole passive.
  - type: spider
    parameters:
      maxDuration: 2
      maxDepth: 10

  # Questo è quello che conta davvero qui: apre l'applicazione in un Firefox
  # headless ed esegue il JavaScript, quindi vede le rotte della SPA e le
  # chiamate che il frontend fa da solo verso /api/*. Senza, la scansione si
  # fermerebbe all'index.html.
  #
  # Il tetto di tre minuti è messo perché l'ajax spider senza limite esplora
  # finché ha stati da visitare, e su un'applicazione che rimanda sempre al
  # login non sono molti, ma il job non deve poter restare appeso.
  - type: spiderAjax
    parameters:
      maxDuration: 3
      maxCrawlDepth: 10

  # Le regole passive girano su una coda asincrona: senza questa attesa il
  # report verrebbe generato mentre metà delle risposte non è ancora stata
  # esaminata, e uscirebbe verde per il motivo sbagliato.
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
    alwaysRun: true

  - type: report
    parameters:
      template: sarif-json
      # Corrisponde al volume montato dal workflow. Il nome del file ha
      # l'estensione aggiunta da ZAP secondo il template, quindi il workflow
      # non lo cerca per nome esatto ma con una glob.
      reportDir: /zap/wrk
      reportFile: zap-dast
      reportTitle: SkillLab DAST
    # Le informational sono il rumore di ZAP (commenti nell'HTML, header
    # informativi): tenute fuori, la tab Security resta leggibile, come già
    # si fa con Trivy limitato a HIGH e CRITICAL.
    risks:
      - low
      - medium
      - high
    # I falsi positivi già classificati come tali da ZAP non servono a nessuno.
    confidences:
      - low
      - medium
      - high
    alwaysRun: true

  # Il codice di uscita, cioè cosa rende rosso il job.
  #
  # La soglia è Medium perché è lì che stanno le trovate passive che valgono
  # qualcosa (CSP assente, cookie senza SameSite). Le Low finiscono comunque
  # nel SARIF e quindi nella tab Security, ma non fermano niente.
  - type: exitStatus
    parameters:
      errorLevel: Medium
    alwaysRun: true
