# Stack di produzione.
#
# Attenzione: docker-compose.override.yml, accanto a questo file, viene letto
# in automatico e lo trasforma in un ambiente di sviluppo con hot-reload. Per
# far girare la produzione serve escluderlo esplicitamente:
#
#   docker compose -f docker-compose.yml up -d --build
#
# Tre regole, che sono il motivo per cui questo file non contiene né password
# né porte affacciate all'esterno:
#
# 1. Nessun segreto scritto qui dentro. Le credenziali del database arrivano
#    dall'ambiente (il file .env accanto a questo, non versionato) e senza
#    password compose si rifiuta di partire, dicendo cosa manca. Un errore in
#    faccia al primo avvio è infinitamente meglio di un database di
#    produzione con dentro "postgres/postgres" che nessuno noterà mai.
#
#    Nessuna delle tre ha un default: chi installa le sceglie, non le eredita
#    da qui. Utente e nome del database contano solo alla prima
#    inizializzazione del volume db_data, quindi cambiarli dopo non li cambia
#    dentro Postgres, li spezza e basta.
#
# 2. Si affaccia su internet un servizio solo, Caddy, che termina TLS ed è
#    l'unica porta d'ingresso. Database, backend e frontend non pubblicano
#    niente: si parlano sulla rete interna di compose, e il browser vede una
#    sola origine, che è ciò che permette ai cookie di sessione (Secure,
#    HttpOnly) di funzionare senza CORS di mezzo.
#
# 3. Il backend gira in più copie. Un processo Python usa un core solo, quindi
#    la capacità si aggiunge in processi, non in macchine: le repliche sono
#    intercambiabili (nessuna tiene stato che serva a un'altra, vedi
#    voice_sessions) e Caddy manda ogni chiamata a quella che ne ha meno in
#    corso. Per cambiarne il numero senza toccare questo file:
#
#      docker compose -f docker-compose.yml up -d --scale backend=6
#
# HTTPS non è opzionale: i cookie di sessione sono Secure, e servita in
# chiaro l'applicazione non riesce nemmeno a tenere il login.

# Un tetto ai log, uguale per tutti i servizi.
#
# Il driver di serie di Docker scrive su file e non cancella mai niente: il
# file cresce finché c'è disco. Qui il backend stampa una riga [LATENCY] per
# ogni turno di ogni chiamata, quindi cinquanta persone in linea scrivono di
# continuo, e Caddy aggiunge una riga per richiesta. Senza tetto il disco si
# riempie in silenzio, e quando succede non cade solo il servizio che
# scriveva: si ferma anche Postgres, che sullo stesso disco ci deve scrivere
# per accettare qualunque cosa.
#
# Il driver è "local" e non "json-file", che sarebbe quello di serie, per una
# ragione sola: comprime i file già ruotati. Il testo si comprime attorno a
# dieci volte, quindi a parità di disco occupato la storia consultabile è
# dieci volte più lunga, e i comandi non cambiano ("docker compose logs"
# legge questo driver come l'altro).
#
# 100 MB per file e 20 file fanno al massimo 2 GB per container, che
# compressi valgono una ventina di GB di testo: mesi di storia a pieno
# carico invece di giorni. Il file in corso di scrittura resta in chiaro,
# quelli vecchi si leggono con zcat.
#
# Il conto va fatto per container e non per servizio, perché il backend ne ha
# quanti BACKEND_REPLICAS: con quattro repliche il caso peggiore assoluto è
# 8 GB di backend più 2 GB per ciascuno degli altri quattro servizi, cioè
# 16 GB. È il tetto che il disco non può superare, non lo spazio che verrà
# occupato davvero, ma è il numero da confrontare con il disco della
# macchina prima di alzare ancora questi valori.
x-logging: &logging
  driver: local
  options:
    max-size: "100m"
    max-file: "20"

services:
  db:
    image: postgres:18-alpine
    # Il tetto delle connessioni sta nel .env accanto a BACKEND_REPLICAS, e
    # non è pignoleria: i due numeri sono legati, perché il conto è
    # repliche * (DB_POOL_SIZE + DB_MAX_OVERFLOW), e sono legati proprio nel
    # momento in cui si cambia il primo. Lasciato scritto qui, il tetto
    # sarebbe rimasto quello buono per quattro repliche anche il giorno che
    # ne fossero state chieste dodici, e il sintomo non è un errore chiaro:
    # è qualche richiesta che ogni tanto non trova una connessione.
    #
    # Il conto per intero sta nel .env, accanto al valore. Postgres di suo ne
    # accetta 100, che a quattro repliche sono già poche.
    command:
      ["postgres", "-c", "max_connections=${DB_MAX_CONNECTIONS:?va messo nel file .env accanto a docker-compose.yml}"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?va messo nel file .env accanto a docker-compose.yml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?va messa nel file .env accanto a docker-compose.yml, e deve essere URL-safe perche finisce dentro DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB:?va messo nel file .env accanto a docker-compose.yml}
    volumes:
      - db_data:/var/lib/postgresql
    deploy:
      resources:
        # Il tetto serve a impedire che il database si prenda tutto, la
        # riserva a impedire che siano gli altri a lasciarlo senza niente.
        # Delle due conta di più la seconda: senza limiti, quattro repliche
        # del backend sotto picco possono spingere Postgres in swap, e un
        # database che scrive su disco al posto che in RAM non rallenta un
        # po', si ferma, e con lui tutto il resto.
        limits:
          cpus: ${DB_CPUS:?va messo nel file .env accanto a docker-compose.yml}
          memory: ${DB_MEM:?va messa nel file .env accanto a docker-compose.yml}
        reservations:
          memory: ${DB_MEM_RESERVED:?va messa nel file .env accanto a docker-compose.yml}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # Postgres allo spegnimento chiude le connessioni aperte e scrive un
    # checkpoint. I dieci secondi di serie di Docker sono pochi se in quel
    # momento c'è lavoro in corso, e scaduti quelli il processo viene ucciso:
    # i dati restano integri, ma il primo avvio dopo si porta via minuti di
    # recovery, proprio mentre stai aspettando che il servizio torni su.
    stop_grace_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Sovrascrive il valore di backend/.env: dentro la rete di compose
      # Postgres risponde al nome del servizio "db", non a localhost.
      # La password deve essere URL-safe: finisce dentro una URL, e una "@"
      # o una "/" la spezzerebbe.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?va messa nel file .env accanto a docker-compose.yml, e deve essere URL-safe perche finisce dentro DATABASE_URL}@db:5432/${POSTGRES_DB:?}
    deploy:
      # Quante copie del backend. Il numero giusto lo dice il test di carico
      # (vedi loadtest/): dipende da quante chiamate regge un processo e da
      # quanti core ha la macchina.
      replicas: ${BACKEND_REPLICAS:?va messo nel file .env accanto a docker-compose.yml}
      resources:
        limits:
          # Un core a replica, che è quanto un processo Python può usare
          # comunque per via del GIL: il tetto qui non toglie niente, evita
          # solo che una replica impazzita occupi i core delle altre e del
          # database.
          cpus: ${BACKEND_CPUS:?va messo nel file .env accanto a docker-compose.yml}
          # Per replica, non in tutto. Una chiamata tiene in RAM i suoi
          # buffer audio, quindi la memoria cresce con le chiamate insieme:
          # se il tetto arriva, il container viene ucciso e riparte (vedi
          # restart), ed è il segnale che il tetto è basso o che le chiamate
          # per processo sono troppe.
          memory: ${BACKEND_MEM:?va messa nel file .env accanto a docker-compose.yml}
    volumes:
      # Persist uploaded avatar images across rebuilds/restarts. Condiviso
      # fra le repliche: l'immagine caricata da una deve essere servita da
      # tutte.
      - backend_static:/app/static
    healthcheck:
      # Curl non c'è nell'immagine slim, ma Python sì. Serve a Caddy per
      # smettere di mandare chiamate a una replica che non risponde più.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      # All'avvio le repliche si mettono in fila su un lock per preparare lo
      # schema (vedi startup_migrations.prepare_schema): l'ultima della coda
      # può metterci un po' prima di rispondere, e non è malata.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging
    # Quanto Docker aspetta dopo il SIGTERM prima di uccidere il processo.
    #
    # Non serve a salvare le chiamate in corso: quelle durano dieci minuti e
    # nessuna attesa ragionevole le copre, quindi a un aggiornamento cadono
    # comunque (vedi INFRASTRUTTURA.md, punto 4.2). Serve alle scritture,
    # che nel percorso vocale partono fire and forget verso il database
    # (vedi voice_pipeline._persist_message): con i dieci secondi di serie
    # quelle ancora in volo vengono troncate, e si perdono gli ultimi pezzi
    # di trascrizione senza che nessuno se ne accorga.
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    deploy:
      resources:
        # Scritti qui e non nel .env come quelli del backend e del database,
        # perché questi non cambiano con la macchina: nginx serve file già
        # compilati, e il suo lavoro non cresce col numero di chiamate.
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Il dominio da servire, ed è anche il nome per cui viene chiesto il
      # certificato: "skilllab.esempio.it" in produzione, "localhost" o ":80"
      # per provare lo stack sul proprio computer.
      #
      # Ha un default invece di essere obbligatoria come le credenziali del
      # database, e per un motivo pratico: compose interpola le variabili di
      # tutti i servizi anche quando poi non li avvia, quindi una variabile
      # obbligatoria qui costringerebbe a inventarsi un dominio anche per
      # lavorare in locale, dove Caddy non parte nemmeno. Dimenticarla in
      # produzione non è pericoloso come una password lasciata al default:
      # il sito risponde solo su localhost e dal dominio vero non risponde
      # niente, cosa che si scopre al primo collaudo.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # I certificati vivono qui. Deve essere un volume, non una cartella
      # temporanea: perderlo significa richiederli daccapo a ogni riavvio, e
      # Let's Encrypt smette di emetterli dopo qualche tentativo nella stessa
      # settimana.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          # Più larghi di quelli del frontend perché qui il lavoro col
          # traffico ci cresce davvero: TLS e inoltro di tutte le chiamate
          # passano da qui, ed è l'unico servizio esposto.
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  db-backup:
    # Stessa immagine del database, così pg_dump è della stessa versione del
    # server che sta copiando.
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      # Ogni quante ore, e quanti file tenere. I default (ogni 6 ore, gli
      # ultimi 28) coprono una settimana abbondante.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./db/backup.sh:/backup.sh:ro
      # Una cartella sull'host, non un volume di Docker: da lì un rsync o un
      # client dello Storage Box può portarli fuori dalla macchina, che è
      # l'unica cosa che li rende dei veri backup.
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Dorme quasi sempre, e quando si sveglia fa un pg_dump che non
          # deve rubare il processore alle chiamate in corso.
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

volumes:
  db_data:
  backend_static:
  caddy_data:
  caddy_config:
