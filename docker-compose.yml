# Stack di produzione.
#
# Attenzione: docker-compose.override.yml, accanto a questo file, viene letto
# in automatico e lo trasforma in un ambiente di sviluppo con hot-reload. Per
# far girare la produzione serve escluderlo esplicitamente:
#
#   docker compose -f docker-compose.yml up -d --build
#
# Tre regole, che sono il motivo per cui questo file non contiene né password
# né porte affacciate all'esterno:
#
# 1. Nessun segreto scritto qui dentro. Le credenziali del database arrivano
#    dall'ambiente (il file .env accanto a questo, non versionato) e senza
#    password compose si rifiuta di partire, dicendo cosa manca. Un errore in
#    faccia al primo avvio è infinitamente meglio di un database di
#    produzione con dentro "postgres/postgres" che nessuno noterà mai.
#
#    Nessuna delle tre ha un default: chi installa le sceglie, non le eredita
#    da qui. Utente e nome del database contano solo alla prima
#    inizializzazione del volume db_data, quindi cambiarli dopo non li cambia
#    dentro Postgres, li spezza e basta.
#
# 2. Si affaccia su internet un servizio solo, Caddy, che termina TLS ed è
#    l'unica porta d'ingresso. Database, backend e frontend non pubblicano
#    niente: si parlano sulla rete interna di compose, e il browser vede una
#    sola origine, che è ciò che permette ai cookie di sessione (Secure,
#    HttpOnly) di funzionare senza CORS di mezzo.
#
# 3. Il backend gira in più copie. Un processo Python usa un core solo, quindi
#    la capacità si aggiunge in processi, non in macchine: le repliche sono
#    intercambiabili (nessuna tiene stato che serva a un'altra, vedi
#    voice_sessions) e Caddy manda ogni chiamata a quella che ne ha meno in
#    corso. Per cambiarne il numero senza toccare questo file:
#
#      docker compose -f docker-compose.yml up -d --scale backend=6
#
# HTTPS non è opzionale: i cookie di sessione sono Secure, e servita in
# chiaro l'applicazione non riesce nemmeno a tenere il login.
services:
  db:
    image: postgres:18-alpine
    # Postgres di suo ne accetta 100, e quel numero va confrontato con la
    # somma dei pool di tutte le repliche del backend, non con una sola
    # (il conto sta in testa a backend/database.py): quattro repliche ne
    # chiedono fino a 80, e i backup e chi si attacca con un client sono
    # ancora fuori dal conto. 200 tiene il margine per crescere senza
    # tornare qui, e costa qualche decina di MB di RAM che una macchina da
    # centinaia di chiamate ha di sicuro.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?va messo nel file .env accanto a docker-compose.yml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?va messa nel file .env accanto a docker-compose.yml, e deve essere URL-safe perche finisce dentro DATABASE_URL}
      POSTGRES_DB: ${POSTGRES_DB:?va messo nel file .env accanto a docker-compose.yml}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Sovrascrive il valore di backend/.env: dentro la rete di compose
      # Postgres risponde al nome del servizio "db", non a localhost.
      # La password deve essere URL-safe: finisce dentro una URL, e una "@"
      # o una "/" la spezzerebbe.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?va messa nel file .env accanto a docker-compose.yml, e deve essere URL-safe perche finisce dentro DATABASE_URL}@db:5432/${POSTGRES_DB:?}
    deploy:
      # Quante copie del backend. Il numero giusto lo dice il test di carico
      # (vedi loadtest/): dipende da quante chiamate regge un processo e da
      # quanti core ha la macchina.
      replicas: 4
    volumes:
      # Persist uploaded avatar images across rebuilds/restarts. Condiviso
      # fra le repliche: l'immagine caricata da una deve essere servita da
      # tutte.
      - backend_static:/app/static
    healthcheck:
      # Curl non c'è nell'immagine slim, ma Python sì. Serve a Caddy per
      # smettere di mandare chiamate a una replica che non risponde più.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      # All'avvio le repliche si mettono in fila su un lock per preparare lo
      # schema (vedi startup_migrations.prepare_schema): l'ultima della coda
      # può metterci un po' prima di rispondere, e non è malata.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Il dominio da servire, ed è anche il nome per cui viene chiesto il
      # certificato: "skilllab.esempio.it" in produzione, "localhost" o ":80"
      # per provare lo stack sul proprio computer.
      #
      # Ha un default invece di essere obbligatoria come le credenziali del
      # database, e per un motivo pratico: compose interpola le variabili di
      # tutti i servizi anche quando poi non li avvia, quindi una variabile
      # obbligatoria qui costringerebbe a inventarsi un dominio anche per
      # lavorare in locale, dove Caddy non parte nemmeno. Dimenticarla in
      # produzione non è pericoloso come una password lasciata al default:
      # il sito risponde solo su localhost e dal dominio vero non risponde
      # niente, cosa che si scopre al primo collaudo.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # I certificati vivono qui. Deve essere un volume, non una cartella
      # temporanea: perderlo significa richiederli daccapo a ogni riavvio, e
      # Let's Encrypt smette di emetterli dopo qualche tentativo nella stessa
      # settimana.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db-backup:
    # Stessa immagine del database, così pg_dump è della stessa versione del
    # server che sta copiando.
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      # Ogni quante ore, e quanti file tenere. I default (ogni 6 ore, gli
      # ultimi 28) coprono una settimana abbondante.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - ./db/backup.sh:/backup.sh:ro
      # Una cartella sull'host, non un volume di Docker: da lì un rsync o un
      # client dello Storage Box può portarli fuori dalla macchina, che è
      # l'unica cosa che li rende dei veri backup.
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
  backend_static:
  caddy_data:
  caddy_config:
