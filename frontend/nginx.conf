# Serve l'applicazione compilata, e basta.
#
# Il proxy verso il backend stava qui: adesso è Caddy, davanti a tutto, a
# smistare /api e /static alle repliche del backend e tutto il resto a questo
# nginx (vedi caddy/Caddyfile). Il motivo non è estetico: nginx risolve il
# nome di un upstream una volta sola all'avvio, quindi con più repliche
# manderebbe tutto sempre alla stessa, e chi decide dove va una chiamata deve
# essere uno solo, non due in fila.
#
# Per il browser non cambia niente: l'origine resta una, quella di Caddy.

server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user
    # that cannot bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite scrive l'impronta del contenuto nel nome di ogni file che finisce
    # qui dentro ("index-C05HFCZ.js"): un file cambiato è un nome nuovo, e
    # questo non tornerà mai a essere diverso da com'è adesso. È esattamente
    # la condizione che "immutable" descrive, e dirlo evita al browser di
    # richiedere per conferma una ventina di file a ogni apertura, che è
    # quello che faceva finora: nessuno di quei giri portava un byte utile,
    # tornavano tutti "non è cambiato".
    #
    # "^~" e non un semplice prefisso: senza, una regola scritta per
    # estensione (quella sotto) vincerebbe su questa e i font e le immagini
    # con l'impronta nel nome ricadrebbero nella scadenza breve.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # L'unico file che non porta l'impronta nel nome, e l'unico che deve
    # cambiare sotto il naso di chi ha la pagina aperta: è lui a nominare gli
    # asset di questa build, quindi tenerlo in cache vorrebbe dire servire
    # per giorni i nomi della build precedente.
    #
    # "no-cache" non vuol dire non conservarlo, vuol dire chiedere conferma
    # prima di riusarlo: quando la build non è cambiata la risposta è un 304
    # di poche decine di byte, e il file non riparte.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Quello che sta nella radice e non passa da Vite: le due icone in
    # public/. Il nome non cambia quando cambia il contenuto, quindi la
    # scadenza è corta abbastanza da non lasciare in giro un'icona vecchia
    # per giorni, e lunga abbastanza da non richiederla a ogni pagina.
    location ~* \.(svg|png|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # React Router: let the app handle client-side routes
    location / {
        try_files $uri /index.html;
    }
}
